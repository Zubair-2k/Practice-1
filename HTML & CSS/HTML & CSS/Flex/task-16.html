<!DOCTYPE html>
<html lang="en">
<head>
    <title>Flex Box-2</title>
    <style>
        .container
        {
            background-color: greenyellow;
            padding: 10px;
        }

        h1{
            text-align: center;
        }

        .gallery{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 5px;
        }

        h2{
            background-color: black;
            color: white;
            margin: 2px;
            padding: 50px;
            flex-basis: 50%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Image Gallery</h1>
        <div class="gallery">
            <h2 >One</h2>
            <h2>Two</h2>
            <h2 id="three">Three</h2>
            <h2>Four</h2>
            <h2>Five</h2>
            <h2>Six</h2>
            <h2>Seven</h2>
            <h2>Eight</h2>
        </div>
    </div>
</body>
</html>

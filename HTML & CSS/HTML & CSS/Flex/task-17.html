<!DOCTYPE html>
<html lang="en">
<head>
    <title>Flex Box-3</title>
    <style>
        div{
            background-color: #008000;
            display: flex;
            flex-wrap: wrap;
            padding: 10px;
        }

        h1{
            background-color: black;
            color: aliceblue;
            flex-basis: 20%;
            flex-grow: 1 ;
            margin: 2px;
        }
    </style>
</head>
<body>
    <div>
        <h1>One</h1>
        <h1>Two</h1>
        <h1>Three</h1>
        <h1>Four</h1>
        <h1>Five</h1>
        <h1>Six</h1>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Flex Box-4</title>
    <style>
        .container
        {
            background-color: aqua;
            display: flex;
            justify-content: center;
        }
        .content{
            background-color: black;
            display: flex;
            flex-wrap: wrap;
            flex-direction: column;
            margin: 100px;
            padding: 10px;
        }
        h1{
            background-color: orange;
            margin: 7px;
            font-size: 10px;
            color: orange;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <h1>Three</h1>
            <h1>Three</h1>
            <h1>Three</h1>
            <h1>Three</h1>
            <h1>Three</h1>
            <h1>Three</h1>
        </div>
    </div>
</body>
</html>

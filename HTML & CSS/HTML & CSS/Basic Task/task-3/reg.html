<!DOCTYPE html>
<head>
    <title>Registration Form</title>
</head>
<body>
    <center>
        <h1>Error Makes Clever Academy</h1>
        <h3>Training | Tech News | Freshers Guide</h3>
        <p>Empowering young developers to level up their skills through training in software development technologies</p>
    </center>

    <hr>

    <center>
        <h3>Registration Form</h3>
        <table>
            <tr>
                <td><label for="name">Name :</label></td>
                <td><input type="text" id="name"></td>
            </tr>

            <tr>
                <td><label for="age">Age :</label></td>
                <td><input type="number" id="age"></td>
            </tr>

            <tr>
                <td><label for="gender">Gender :</label></td>
                <td><input type="radio" name="gender">Male
                    <input type="radio" name="gender">Female</td>
            </tr>

            <tr>
                <td><label for="email">Email</label></td>
                <td><input type="text" id="email"></td>
            </tr>

            <tr>
                <td><label for="course">Select a Course</label></td>
                <td><select>
                    <option>Full Stack Development</option>
                </select></td>
            </tr>

            <tr>
                <td><label for="resume">Upload your Resume</label></td>
                <td><input type="file" id="resume"></td>
            </tr>

            <tr>
                <td><input type="reset"></td>
                <td><input type="submit"></td>
            </tr>
            
        </table>
    </center>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query-1</title>
    <style>
        h1{
            color: red;
        }

        @media screen and (max-width:600px)
        {
            h1
            {
                color: yellow;
            }
        }

        @media screen and (max-width:400px)
        {
            h1
            {
                color: blue;
            }
        }
        
    </style>
</head>
<body>
    <h1>Hello</h1>
</body>
</html>

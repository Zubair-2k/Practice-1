<!DOCTYPE html>
<html lang="en">
<head>
    <title>Display Prop-1</title>
    <style>
        .container-1{
            width: 200px;
            height: 200px;
            background-color: black;
            display: inline-block;
        }

        .container-2{
            width: 200px;
            height: 200px;
            background-color: red;
            display: inline-block;
        }

        .content-1
        {
            background-color: yellow;
            display: inline;
        }

        .content-2{
            background-color: red;
            color: white;
            display: inline;
        }
    </style>
</head>
<body>
    <div class="container-1">
    </div>
    <div class="container-2">
    </div>
    <p class="content-1">Hi</p>
    <p class="content-2">Bye</p>
</body>
</html>

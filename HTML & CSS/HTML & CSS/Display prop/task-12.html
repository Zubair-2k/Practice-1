<!DOCTYPE html>
<html lang="en">
<head>
    <title>Display Prop-3</title>
    <style>
        nav{
            background-color: black;
            color: white;
            padding: 10px;
        }

        h1{
            display: inline;
        }

        ul{
            list-style-type: none;
            float: right;
            line-height: 0px;
        }

        li{
            display: inline;
            margin-right: 20px;
        }
    </style>
</head>
<body>
    <nav>
        <h1>Navbar</h1>
        <ul>
            <li>Home</li>
            <li>About Us</li>
            <li>Contact</li>
        </ul>
    </nav>
</body>
</html>

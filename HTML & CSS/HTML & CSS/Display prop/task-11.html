<!DOCTYPE html>
<html lang="en">
<head>
    <title>Display Prop-2</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        ul{
            list-style-type: none;
            margin: 20px;
        }

        li{
            background-color: black;
            color: white;
            padding: 5px;
            display: inline;
            margin-right: 30px;
        }
    </style>
</head>
<body>
    <ul>
        <li>Home</li>
        <li>About Us</li>
        <li>Contact Us</li>
    </ul>
</body>
</html>

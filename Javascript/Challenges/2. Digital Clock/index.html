<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="digital_clock">
        
        <h1>Digital Clock</h1>

        <div class="digital_clock_container">

            <h3 class="fullDate"></h3>

            <div class="digital_clock_items">

                <div class="digital_clock_item">
                    <h2 class="dayValue"></h2>
                    <span>Day</span>
                </div>
    
                <p>:</p>
    
                <div class="digital_clock_item">
                    <h2 class="hoursValue"></h2>
                    <span>Hours</span>
                </div>
    
                <p>:</p>
    
                <div class="digital_clock_item">
                    <h2 class="minsValue"></h2>
                    <span>Minutes</span>
                </div>
    
                <p>:</p>
    
                <div class="digital_clock_item">
                    <h2 class="secValue"></h2>
                    <span>Seconds</span>
                </div>

            </div>

        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>

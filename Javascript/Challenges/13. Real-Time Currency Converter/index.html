<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Currency Converter</title>
    <link rel="stylesheet" href="index.css">
    
    <!-- API ExchangeRate -->

    <!-- https://api.exchangerate-api.com/v4/latest/ -->

</head>
<body>
    <div class="currencyConverter">
        <div class="currencyConverterContainer">
            <h2 class="currencyConverterHeading">Currency Converter</h2>

            <form action="">
                
                <div class="amount">
                    
                    <label for="">
                        Amount:
                    </label>
                    
                    <input type="number" class="amountInput" onkeyup="handleAmount(event)" value="1"/>
                
                </div>

                <div class="fromCurrency">
                    
                    <label for="">
                        From Currency:
                    </label>
                    
                    <select class="fromCurrencyField" onchange="handleFromCurrency(event)">
                        <option value="USD">USD - United States Dollar</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="GBP">GBP - British Pound Sterling</option>
                        <option value="JPY">JPY - Japanese Yen</option>
                        <option value="AUD">AUD - Australian Dollar</option>
                        <option value="CAD">CAD - Canadian Dollar</option>
                        <option value="CNY">CNY - Chinese Yuan</option>
                        <option value="INR">INR - Indian Rupee</option>
                        <option value="BRL">BRL - Brazilian Real</option>
                        <option value="ZAR">ZAR - South African Rand</option>
                    </select>
                    
                </div>
                
                <div class="toCurrency">
                    
                    <label for="">
                        To Currency:
                    </label>
                    
                    <select class="toCurrencyField" onchange="handleToCurrency(event)">
                        <option value="INR">INR - Indian Rupee</option>
                        <option value="USD">USD - United States Dollar</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="GBP">GBP - British Pound Sterling</option>
                        <option value="JPY">JPY - Japanese Yen</option>
                        <option value="AUD">AUD - Australian Dollar</option>
                        <option value="CAD">CAD - Canadian Dollar</option>
                        <option value="CNY">CNY - Chinese Yuan</option>
                        <option value="BRL">BRL - Brazilian Real</option>
                        <option value="ZAR">ZAR - South African Rand</option>
                    </select>
                </div>
                
                <div class="currencyDisplay">1 USD = 82.98 INR</div>

            </form>

        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>

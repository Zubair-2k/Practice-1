<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="randomPassword">
        <div class="randomPasswordContainer">
            <h2 class="randomPasswordHeading">Random Password Generator</h2>

            <form action="">
                <div class="checkboxField">
                    <input type="checkbox" class="includesNumberValue"/>
                    <label>Include Numbers (0-9)</label>
                </div>
                <div class="checkboxField">
                    <input type="checkbox" class="smallAlphabetValue"/>
                    <label>Include Lowercase letters (a-z)</label>
                </div>
                <div class="checkboxField">
                    <input type="checkbox" class="largeAlphabetValue"/>
                    <label>Include Uppercase letters (A-Z)</label>
                </div>
                <div class="checkboxField">
                    <input type="checkbox" class="includesSymbolValue"/>
                    <label>Include Symbols (@ - $)</label>
                </div>
                <div class="passwordLength">
                    <input type="range" class="passwordLengthRange" value="16"/>
                    <p class="passwordLengthValue">16</p>
                </div>

                <div class="passwordBtn">
                    <button class="generatePasswordBtn">Generate Password</button>
                    <button class="clearPasswordBtn">Clear</button>
                </div>

            </form>

            <div class="passwordField">
                
                <input type="text" class="passwordInput" placeholder="Create a Password" disabled/>
                <button class="copyPasswordBtn">Copy</button>
            </div>


        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>

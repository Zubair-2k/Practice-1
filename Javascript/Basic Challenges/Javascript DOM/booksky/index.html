<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>BookSky</title>
</head>
<body>

    <div class="overall_container">
        <div class="navbar">
            <h1>BOOKSKY</h1>
        </div>

        <div class="container">
        </div>

        <div class="add_btn">
            <button id="add">+</button>
        </div>
    </div>

    <div class="overlay"></div>
    <div class="overlay_box">
        <h1>ADD BOOK</h1>
        <form>
            <input type="text" placeholder="Book Title" id="book_title">
            <input type="text" placeholder="Book Author" id="book_author">
            <textarea placeholder="Short Description" id="book_description"></textarea>
            <button id="add_overlay"><b>Add</b></button>
            <button id="cancel_overlay"><b>Cancel</b></button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>

<style>
    .overlay{
        background-color: black;
        width: 100%;
        height: 100%;
        opacity: 0.8;
        top: 0;
        left: 0;
        position: absolute;
        display: none;
        z-index: 1;
    }

    .popup{
        background-color: white;
        color: black;
        width: 40%;
        position: absolute;
        display: none;
        left: 50%;
        border-radius: 10px;
        padding: 20px;
        z-index: 2;
    }

</style>

<button onclick="show()">Show</button>

<div class="overlay"></div>
<div class="popup">
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quis assumenda ipsa dolorem. Vel consequuntur, consectetur ullam a nemo unde delectus hic. Incidunt vitae saepe repudiandae. Delectus molestias odio vel cupiditate!</p>
    <button onclick="closepopup()">Close</button>
</div>

<script>
    var overlaybox=document.querySelector(".overlay")
    var popupbox=document.querySelector(".popup")

    function show()
    {
        popupbox.style.display="block"
        overlaybox.style.display="block"
    }

    function closepopup()
    {
        popupbox.style.display="none"
        overlaybox.style.display="none"
    }
</script>
